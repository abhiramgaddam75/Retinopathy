[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xaidr"
version = "1.0.0"
description = "Explainable AI-driven deep learning for diabetic retinopathy detection and severity grading (DR-XAI)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs real data, a trained model or more than a few seconds"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# notebook cell sources are kept as written in the notebook
"tools/make_notebooks.py" = ["E501"]
