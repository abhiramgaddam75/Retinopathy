[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xaidr"
version = "1.0.0"
description = "Explainable AI-driven deep learning for diabetic retinopathy detection and severity grading (DR-XAI)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
